name: Type Check

on:
  pull_request:
    branches:
      - main
      - release

jobs:
  type-check:
    name: type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (landing-site)
        run: npm ci
        working-directory: ./landing-site

      - name: Run Type Check (landing-site)
        run: npx tsc --noEmit
        working-directory: ./landing-site

      - name: Install dependencies (checkout-site)
        run: npm ci
        working-directory: ./checkout-site

      - name: Run Type Check (checkout-site)
        run: npx tsc --noEmit
        working-directory: ./checkout-site
