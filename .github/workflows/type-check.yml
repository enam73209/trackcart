name: Type Check

on:
  pull_request:
    branches: [ main ]

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Check landing-site
      - name: Install dependencies (landing-site)
        run: npm ci
        working-directory: ./landing-site

      - name: Run Type Check (landing-site)
        run: npx tsc --noEmit
        working-directory: ./landing-site

      # Check checkout-site
      - name: Install dependencies (checkout-site)
        run: npm ci
        working-directory: ./checkout-site

      - name: Run Type Check (checkout-site)
        run: npx tsc --noEmit
        working-directory: ./checkout-site